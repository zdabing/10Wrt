name: Build common

on:
  workflow_call:
    inputs:
      target:
        description: 'x86_64 或 r5c'
        required: true
        type: string
      version:
        description: 'OpenWrt 源码分支'
        required: true
        type: string
      zen_ref:
        description: 'Zen 源码分支或标签'
        required: false
        default: 'main'
        type: string
      publish_release:
        description: '是否发布 Release 并清理旧版本'
        required: false
        default: true
        type: boolean

jobs:
  firmware:
    name: 编译固件
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建/删除 Release 与 Tag
      actions: write    # 清理旧 dl 缓存

    env:
      OPENWRT_REPO: https://github.com/openwrt/openwrt.git
      OPENWRT_VERSION: ${{ inputs.version }}
      ZEN_REF: ${{ inputs.zen_ref }}

    steps:
      - name: 检出配置仓库
        uses: actions/checkout@v6
        with:
          path: config

      - name: 验证发布脚本
        run: python3 config/.github/scripts/test-publish-firmware.py

      - name: 载入设备配置
        run: bash config/scripts/build-target-env.sh "${{ inputs.target }}" >> "$GITHUB_ENV"

      - name: 清理磁盘空间
        run: |
          # 释放 GitHub 托管 Runner 预装的大体积无用文件，避免编译中途磁盘耗尽
          # （从零编译工具链+内核+全量 Go 包需 25~40G，初始仅 ~20G 可用，曾因此失败）
          # 注意：不删 /opt/hostedtoolcache —— actions/cache 等 Node 20+ 复合 action 依赖它
          sudo apt clean
          sudo apt-get -y autoremove --purge >/dev/null 2>&1 || true
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android    # Android SDK（~10GB+）
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift          # ~5GB
          sudo rm -rf /usr/share/powershell
          sudo rm -rf /usr/lib/mono
          sudo rm -rf /usr/local/go             # 构建用自建 go-cross，不需要系统 Go
          df -h

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            build-essential bash curl file gawk gcc-multilib \
            gettext git graphviz libelf-dev libncurses5-dev \
            libssl-dev python3 python3-setuptools python3-pyelftools \
            rsync swig unzip wget zlib1g-dev \
            clang llvm nodejs npm
          # 部分第三方 LuCI 前端构建需要 pnpm
          sudo npm install -g pnpm

      - name: 检出 OpenWrt 源码
        run: |
          git clone --depth=1 -b "$OPENWRT_VERSION" \
            "$OPENWRT_REPO" openwrt

      - name: 还原 dl 缓存
        uses: actions/cache@v5
        with:
          path: openwrt/dl
          key: dl-openwrt-${{ inputs.target == 'x86_64' && 'x86' || 'r5c' }}
          restore-keys: dl-openwrt-

      - name: 复制 files 覆盖层
        run: |
          if [ -d config/files ]; then
            cp -rv config/files openwrt/
          fi

      - name: 执行 diy.sh 自定义脚本
        run: |
          cp config/diy.sh openwrt/
          chmod +x openwrt/diy.sh
          cd openwrt
          ./diy.sh

      - name: R5C Rust 编译器复用官方 LLVM
        if: inputs.target == 'r5c'
        run: |
          set -euo pipefail
          RUST_MAKEFILE=openwrt/feeds/packages/lang/rust/Makefile
          RUST_VERSION=$(sed -n 's/^PKG_VERSION:=//p' "$RUST_MAKEFILE")
          CI_LLVM_URL=https://ci-artifacts.rust-lang.org/rustc-builds/ac68faa20c58cbccd01ee7208bf3b6e93a7d7f96/rust-dev-1.96.0-x86_64-unknown-linux-gnu.tar.xz
          if [ "$RUST_VERSION" = 1.96.0 ] && \
             grep -qF -- '--set=llvm.download-ci-llvm=false' "$RUST_MAKEFILE" && \
             curl -fsSIL --retry 2 "$CI_LLVM_URL" >/dev/null; then
            sed -i 's/--set=llvm.download-ci-llvm=false/--set=llvm.download-ci-llvm=true/' "$RUST_MAKEFILE"
            echo 'Rust 1.96.0 使用官方 CI LLVM'
          else
            echo "Rust $RUST_VERSION 使用 OpenWrt 默认 LLVM 编译配置"
          fi

      - name: 复制种子配置
        run: |
          cp "$SEED_PATH" openwrt/.config

      - name: 展开配置
        run: |
          cd openwrt
          set -o pipefail
          echo "CONFIG_JSON_OVERVIEW_IMAGE_INFO=y" >> .config
          make defconfig 2>&1 | tee defconfig.log
          if grep -Eq '(^|:)(error:|fatal error:)' defconfig.log; then
            echo "错误：make defconfig 输出了 Kconfig 错误"
            exit 1
          fi
          echo "=== 关键配置项 ==="
          grep -E '^(CONFIG_TARGET|CONFIG_PACKAGE_luci)' .config | sort

      - name: 验证设备配置
        run: |
          cd openwrt
          if ! grep -qxF "${DEVICE_SYMBOL}=y" .config; then
            echo "错误：${TARGET_LABEL} 设备未在 .config 中选中！"
            grep 'CONFIG_TARGET.*DEVICE_' .config || echo "(无)"
            exit 1
          fi
          echo "设备配置验证通过：${TARGET_LABEL}"
          # 一次核对 seed，避免缺失的软件源被 defconfig 静默丢弃。
          bash ../config/scripts/validate-seed-packages.sh "../${SEED_PATH}" .config
          grep -qxF 'CONFIG_LUCI_LANG_zh_Hans=y' .config || {
            echo '错误：LuCI 简体中文配置未生效'
            exit 1
          }

      - name: 计算 R5C Rust 分发包缓存身份
        if: inputs.target == 'r5c'
        id: rust-cache-key
        run: python3 config/scripts/rust-dist-cache.py prepare openwrt rust-dist-cache >> "$GITHUB_OUTPUT"

      - name: 还原匹配的 Rust 分发包
        if: inputs.target == 'r5c'
        id: rust-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: rust-dist-cache
          key: rust-dist-v1-${{ steps.rust-cache-key.outputs.key }}

      - name: 写入固件构建身份
        run: |
          TAG_EPOCH=$(date +%s)
          TAG_DATE=$(TZ=UTC-8 date -d "@$TAG_EPOCH" +'%Y.%-m.%-d')
          TAG_CLOCK=$(TZ=UTC-8 date -d "@$TAG_EPOCH" +%H%M%S)
          FIRMWARE_TAG="v${TAG_DATE}-t${TAG_CLOCK}-openwrt-${BUILD_TARGET}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          export FIRMWARE_TAG
          echo "FIRMWARE_TAG=$FIRMWARE_TAG" >> "$GITHUB_ENV"
          python3 config/scripts/firmware-update-metadata.py stamp

      - name: 编译固件
        run: |
          cd openwrt
          bash ../config/scripts/build-firmware.sh
        timeout-minutes: 360

      - name: 生成并验证发布记录
        run: |
          bash config/scripts/create-build-records.sh "$FIRMWARE_TARGET" "$GITHUB_SHA"
          python3 config/scripts/firmware-update-metadata.py release --firmware-dir "openwrt/bin/targets/$FIRMWARE_TARGET"

      - name: 调试 - 列出构建输出
        if: always()
        run: |
          echo "=== bin/targets 目录结构 ==="
          find openwrt/bin/targets -type f 2>/dev/null | head -50 || echo "(空)"
          echo ""
          echo "=== build.log 最后 30 行 ==="
          tail -30 openwrt/build.log 2>/dev/null || echo "(无 build.log)"

      - name: 上传固件
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: 10Wrt-openwrt-${{ inputs.target }}-${{ github.run_id }}
          path: |
            openwrt/bin/targets/**/*.img.gz
            openwrt/bin/targets/**/*.img
            openwrt/bin/targets/**/*.bin
            openwrt/bin/targets/**/*.tar.gz
            openwrt/bin/targets/**/openwrt-*-*
            openwrt/bin/targets/**/SHA256SUMS
            openwrt/bin/targets/**/10wrt-packages.manifest
            openwrt/bin/targets/**/10wrt-sources.tsv
            openwrt/bin/targets/**/10wrt-update.json
          if-no-files-found: warn
          retention-days: 7

      - name: 生成固件清单
        if: always()
        run: |
          echo "## 10Wrt OpenWrt ${TARGET_LABEL} 编译结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d openwrt/bin/targets ]; then
            echo "### 固件文件" >> $GITHUB_STEP_SUMMARY
            find openwrt/bin/targets -type f \( \
              -name "*.img.gz" -o -name "*.img" -o -name "*.bin" -o -name "*.tar.gz" \) | \
              sort | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 管理地址: http://10.0.0.1" >> $GITHUB_STEP_SUMMARY
          if [ -f "openwrt/bin/targets/${FIRMWARE_TARGET}/SHA256SUMS" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### SHA256 校验值" >> $GITHUB_STEP_SUMMARY
            cat "openwrt/bin/targets/${FIRMWARE_TARGET}/SHA256SUMS" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 保存成功构建的 R5C Rust 分发包
        if: inputs.target == 'r5c' && steps.rust-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: rust-dist-cache
          key: rust-dist-v1-${{ steps.rust-cache-key.outputs.key }}

      - name: 发布到 Release
        if: success() && inputs.publish_release
        run: |
          bash config/.github/scripts/publish-firmware.sh "$BUILD_TARGET" "openwrt/bin/targets/${FIRMWARE_TARGET}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 清理旧 Release/Tag（OpenWrt 本设备系列仅保留最新 7 个）
        if: success() && inputs.publish_release
        run: |
          # 仅清理 OpenWrt 本设备，保留最新 7 个；旧 Tag 通过标题区分源码。
          # 更旧的 Release 与其 git tag 一并删除（--cleanup-tag）。
          # 若构建失败则本步骤不执行，不会误删。
          for DEVICE in "$BUILD_TARGET"; do
            PREFIX="openwrt-${DEVICE}"
            echo "=== 清理前缀 ${PREFIX}（保留最新 7 个）==="
            gh api "repos/${{ github.repository }}/releases?per_page=100" \
              --jq 'sort_by(.published_at // .created_at) | reverse | .[] | select((.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-t[0-9]{6}-'"${PREFIX}"'-[0-9]+-[0-9]+$")) or (.tag_name | startswith("'"${PREFIX}-"'")) or ((.tag_name | startswith("'"${DEVICE}-"'")) and (.name | startswith("10Wrt OpenWrt ")))) | .tag_name' 2>/dev/null \
              | tail -n +8 | while read -r TAG; do
                echo "删除旧 Release/Tag: ${TAG}"
                gh release delete "$TAG" --yes --cleanup-tag \
                  --repo ${{ github.repository }} || \
                  echo "警告：删除 ${TAG} 失败，已跳过"
              done
          done
          echo "清理完成"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 清理旧 dl 缓存（每个 key 仅保留最新 1 个版本）
        run: |
          # Actions 免费额度仅 0.5GB 存储（缓存+构件），dl 缓存每次构建都会给同一 key 新增一个版本，
          # 不清理会持续累积。这里只保留每个 key 最新 1 个版本，其余删除。
          for KEY in "dl-openwrt-${CACHE_SUFFIX}"; do
            echo "=== 清理缓存前缀 ${KEY} ==="
            gh api "repos/${{ github.repository }}/actions/caches?per_page=100" \
              --jq '.actions_caches[] | select(.key | startswith("'"$KEY"'")) | [.id, .created_at] | @tsv' 2>/dev/null \
              | sort -k2,2r | tail -n +2 | cut -f1 | while read -r CID; do
                echo "删除缓存: ${CID}"
                gh api --method DELETE "repos/${{ github.repository }}/actions/caches/${CID}" || \
                  echo "警告：删除缓存 ${CID} 失败，已跳过"
              done
          done
          echo "dl 缓存清理完成"
        env:
          GH_TOKEN: ${{ github.token }}
