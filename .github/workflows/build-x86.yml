name: Build x86/64
run-name: Build OpenWrt x86/64

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenWrt 源码分支（默认 openwrt-25.12）'
        required: false
        default: 'openwrt-25.12'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-common.yml
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    with:
      target: x86_64
      version: ${{ inputs.version || 'openwrt-25.12' }}
