name: Build NanoPi R5C
run-name: Build OpenWrt NanoPi R5C

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenWrt 源码分支（默认 openwrt-25.12）'
        required: false
        default: 'openwrt-25.12'
        type: string
      zen_ref:
        description: 'Zen 源码分支或标签（默认 main）'
        required: false
        default: 'main'
        type: string
      publish_release:
        description: '发布 Release 并执行原有旧版本清理；测试构建保持关闭'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-common.yml
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    with:
      target: r5c
      version: ${{ inputs.version || 'openwrt-25.12' }}
      zen_ref: ${{ inputs.zen_ref || 'main' }}
      publish_release: ${{ inputs.publish_release }}
