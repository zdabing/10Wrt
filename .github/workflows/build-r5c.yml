name: Build NanoPi R5C

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'ImmortalWrt 版本分支'
        required: false
        default: 'openwrt-25.12'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      IMMORTALWRT_REPO: https://github.com/immortalwrt/immortalwrt.git
      IMMORTALWRT_VERSION: ${{ inputs.version || 'openwrt-25.12' }}

    steps:
      - name: 检出配置仓库
        uses: actions/checkout@v4
        with:
          path: config

      - name: 清理磁盘空间
        run: |
          sudo apt clean
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            build-essential bash curl file gawk gcc-multilib \
            gettext git graphviz libelf-dev libncurses5-dev \
            libssl-dev python3 python3-setuptools python3-pyelftools \
            rsync swig unzip wget zlib1g-dev

      - name: 检出 ImmortalWrt 源码
        run: |
          git clone --depth=1 -b ${{ env.IMMORTALWRT_VERSION }} \
            ${{ env.IMMORTALWRT_REPO }} immortalwrt

      - name: 还原 dl 缓存
        uses: actions/cache@v4
        with:
          path: immortalwrt/dl
          key: dl-immortalwrt
          restore-keys: dl-

      - name: 复制种子配置
        run: |
          cp config/configs/r5c.seed immortalwrt/.config

      - name: 复制 files 覆盖层
        run: |
          if [ -d config/files ]; then
            cp -rv config/files immortalwrt/
          fi

      - name: 执行 diy.sh 自定义脚本
        run: |
          cp config/diy.sh immortalwrt/
          chmod +x immortalwrt/diy.sh
          cd immortalwrt
          ./diy.sh

      - name: 展开配置
        run: |
          cd immortalwrt
          make defconfig
          echo "=== 关键配置项 ==="
          grep -E '^(CONFIG_TARGET|CONFIG_PACKAGE_luci)' .config | sort

      - name: 验证设备配置
        run: |
          cd immortalwrt
          if ! grep -q "CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-r5c=y" .config; then
            echo "错误：R5C 设备未在 .config 中选中！"
            grep 'CONFIG_TARGET.*DEVICE_' .config || echo "(无)"
            exit 1
          fi
          echo "设备配置验证通过：friendlyarm_nanopi-r5c"

      - name: 编译固件
        run: |
          cd immortalwrt
          set -o pipefail

          echo "=== 第一步：编译工具链 (tools) ==="
          make tools/compile -j$(nproc) V=s 2>&1 | tee -a build.log || \
            make tools/compile -j$(nproc) V=s 2>&1 | tee -a build.log || \
            make tools/compile -j1 IGNORE_ERRORS=1 V=s 2>&1 | tee -a build.log

          echo "=== 第二步：编译交叉工具链 (toolchain) ==="
          make toolchain/compile -j$(nproc) V=s 2>&1 | tee -a build.log || \
            make toolchain/compile -j$(nproc) V=s 2>&1 | tee -a build.log || \
            make toolchain/compile -j1 IGNORE_ERRORS=1 V=s 2>&1 | tee -a build.log

          echo "=== 第三步：编译内核/目标 (target) ==="
          make target/compile -j$(nproc) V=s 2>&1 | tee -a build.log || \
            make target/compile -j$(nproc) V=s IGNORE_ERRORS=1 2>&1 | tee -a build.log || \
            make target/compile -j1 IGNORE_ERRORS=1 V=s 2>&1 | tee -a build.log

          echo "=== 第四步：编译软件包 (package) ==="
          make package/compile -j$(nproc) V=s IGNORE_ERRORS=1 2>&1 | tee -a build.log || \
            make package/compile -j$(nproc) V=s IGNORE_ERRORS=1 2>&1 | tee -a build.log

          echo "=== 第五步：生成包索引 ==="
          make package/index V=s 2>&1 | tee -a build.log

          echo "=== 第六步：安装软件包 ==="
          make package/install -j$(nproc) V=s 2>&1 | tee -a build.log || \
            make package/install -j1 V=s 2>&1 | tee -a build.log

          echo "=== 第七步：生成固件 ==="
          make target/install -j$(nproc) V=s 2>&1 | tee -a build.log || \
            make target/install -j1 V=s 2>&1 | tee -a build.log

        timeout-minutes: 360

      - name: 调试 - 列出构建输出
        if: always()
        run: |
          echo "=== bin/targets 目录结构 ==="
          find immortalwrt/bin/targets -type f 2>/dev/null | head -50 || echo "(空)"
          echo ""
          echo "=== build.log 最后 30 行 ==="
          tail -30 immortalwrt/build.log 2>/dev/null || echo "(无 build.log)"

      - name: 上传固件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 10Wrt-r5c-${{ github.run_id }}
          path: |
            immortalwrt/bin/targets/**/*.img.gz
            immortalwrt/bin/targets/**/*.img
            immortalwrt/bin/targets/**/*.bin
            immortalwrt/bin/targets/**/*.tar.gz
            immortalwrt/bin/targets/**/immortalwrt-*-*
          if-no-files-found: warn
          retention-days: 30

      - name: 生成固件清单
        if: always()
        run: |
          echo "## 10Wrt NanoPi R5C 编译结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d immortalwrt/bin/targets ]; then
            echo "### 固件文件" >> $GITHUB_STEP_SUMMARY
            find immortalwrt/bin/targets -type f \( \
              -name "*.img.gz" -o -name "*.img" -o -name "*.bin" -o -name "*.tar.gz" \) | \
              sort | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 管理地址: http://10.0.0.1" >> $GITHUB_STEP_SUMMARY

      - name: 发布到 Release
        run: |
          shopt -s nullglob
          TAG="r5c-$(TZ=Asia/Shanghai date +%Y.%m.%d)-${{ github.run_number }}"
          TITLE="10Wrt NanoPi R5C — $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          FIRMWARE_DIR=$(find immortalwrt/bin/targets -mindepth 1 -type d -name "armv8" 2>/dev/null | head -1)
          if [ -z "$FIRMWARE_DIR" ]; then
            echo "警告：未找到固件目录，跳过发布"
            exit 0
          fi
          echo "固件目录: $FIRMWARE_DIR"
          ls -lh "$FIRMWARE_DIR"/
          gh release create "$TAG" $FIRMWARE_DIR/*.img.gz $FIRMWARE_DIR/*.img $FIRMWARE_DIR/*.tar.gz 2>/dev/null \
            --title "$TITLE" \
            --notes "### 管理地址: http://10.0.0.1" \
            --latest \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
