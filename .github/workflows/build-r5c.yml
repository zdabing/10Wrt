name: Build NanoPi R5C

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenWrt 版本分支'
        required: false
        default: 'openwrt-25.12'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      OPENWRT_REPO: https://github.com/openwrt/openwrt.git
      OPENWRT_VERSION: ${{ inputs.version || 'openwrt-25.12' }}

    steps:
      - name: 检出配置仓库
        uses: actions/checkout@v6
        with:
          path: config

      - name: 清理磁盘空间
        run: |
          # 释放 GitHub 托管 Runner 预装的大体积无用文件，避免编译中途磁盘耗尽
          # （从零编译工具链+内核+全量 Go 包需 25~40G，初始仅 ~20G 可用，曾因此失败）
          # 注意：不删 /opt/hostedtoolcache —— actions/cache 等 Node 20+ 复合 action 依赖它
          sudo apt clean
          sudo apt-get -y autoremove --purge >/dev/null 2>&1 || true
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android    # Android SDK（~10GB+）
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift          # ~5GB
          sudo rm -rf /usr/share/powershell
          sudo rm -rf /usr/lib/mono
          sudo rm -rf /usr/local/go             # 构建用自建 go-cross，不需要系统 Go
          df -h

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            build-essential bash curl file gawk gcc-multilib \
            gettext git graphviz libelf-dev libncurses5-dev \
            libssl-dev python3 python3-setuptools python3-pyelftools \
            rsync swig unzip wget zlib1g-dev \
            clang llvm nodejs npm
          # 部分第三方 LuCI 前端构建需要 pnpm
          sudo npm install -g pnpm

      - name: 检出 OpenWrt 源码
        run: |
          git clone --depth=1 -b ${{ env.OPENWRT_VERSION }} \
            ${{ env.OPENWRT_REPO }} openwrt

      - name: 还原 dl 缓存
        uses: actions/cache@v5
        with:
          path: openwrt/dl
          key: dl-openwrt-r5c
          restore-keys: dl-openwrt-

      - name: 复制 files 覆盖层
        run: |
          if [ -d config/files ]; then
            cp -rv config/files openwrt/
          fi

      - name: 执行 diy.sh 自定义脚本
        run: |
          cp config/diy.sh openwrt/
          chmod +x openwrt/diy.sh
          cd openwrt
          ./diy.sh

      - name: 复制种子配置
        run: |
          cp config/configs/r5c.seed openwrt/.config

      - name: 展开配置
        run: |
          cd openwrt
          make defconfig
          echo "=== 关键配置项 ==="
          grep -E '^(CONFIG_TARGET|CONFIG_PACKAGE_luci)' .config | sort

      - name: 验证设备配置
        run: |
          cd openwrt
          if ! grep -q "CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-r5c=y" .config; then
            echo "错误：R5C 设备未在 .config 中选中！"
            grep 'CONFIG_TARGET.*DEVICE_' .config || echo "(无)"
            exit 1
          fi
          echo "设备配置验证通过：friendlyarm_nanopi-r5c"
          # LuCI 25.12 的语言包是隐藏项，直接写 CONFIG_PACKAGE_luci-i18n-* 会被
          # make defconfig 丢弃。全局语言开关必须保留，并自动选中基础中文包。
          if ! grep -q "^CONFIG_LUCI_LANG_zh_Hans=y$" .config; then
            echo "错误：LuCI 简体中文全局开关未生效！"
            grep 'CONFIG_LUCI_LANG' .config || echo "(无)"
            exit 1
          fi
          REQUIRED_I18N_CONFIGS=(
            luci-i18n-base-zh-cn luci-i18n-ddns-zh-cn
            luci-i18n-firewall-zh-cn luci-i18n-package-manager-zh-cn
            luci-i18n-ttyd-zh-cn luci-i18n-upnp-zh-cn luci-i18n-wol-zh-cn
          )
          MISSING_I18N_CONFIGS=()
          for PACKAGE in "${REQUIRED_I18N_CONFIGS[@]}"; do
            grep -qxF "CONFIG_PACKAGE_${PACKAGE}=y" .config || MISSING_I18N_CONFIGS+=("$PACKAGE")
          done
          if (( ${#MISSING_I18N_CONFIGS[@]} > 0 )); then
            echo "错误：以下 LuCI 中文语言包未被自动选中："
            printf '  - %s\n' "${MISSING_I18N_CONFIGS[@]}"
            exit 1
          fi
          echo "LuCI 简体中文配置验证通过：${#REQUIRED_I18N_CONFIGS[@]} 个语言包"
          # 自动核对 seed 中所有显式选中的软件包，第三方源码缺失时立即失败。
          SEED="../config/configs/r5c.seed"
          bash ../config/scripts/validate-seed-packages.sh "$SEED" .config

      - name: 编译固件
        run: |
          cd openwrt
          set -o pipefail

          echo "=== 第一步：编译工具链 (tools) ==="
          make tools/compile -j$(nproc) V=s 2>&1 | tee -a build.log || \
            make tools/compile -j$(nproc) V=s 2>&1 | tee -a build.log || \
            make tools/compile -j1 V=s 2>&1 | tee -a build.log

          echo "=== 第二步：编译交叉工具链 (toolchain) ==="
          make toolchain/compile -j$(nproc) V=s 2>&1 | tee -a build.log || \
            make toolchain/compile -j$(nproc) V=s 2>&1 | tee -a build.log || \
            make toolchain/compile -j1 V=s 2>&1 | tee -a build.log

          echo "=== 第三步：编译内核/目标 (target) ==="
          make target/compile -j$(nproc) V=s 2>&1 | tee -a build.log || \
            make target/compile -j1 V=s 2>&1 | tee -a build.log

          echo "=== 第四步：编译软件包 (package) ==="
          make package/compile -j$(nproc) V=s 2>&1 | tee -a build.log || \
            make package/compile -j1 V=s 2>&1 | tee -a build.log

          echo "=== 第五步：生成包索引 ==="
          make package/index V=s 2>&1 | tee -a build.log

          echo "=== 第六步：安装软件包 ==="
          make package/install -j$(nproc) V=s 2>&1 | tee -a build.log || \
            make package/install -j1 V=s 2>&1 | tee -a build.log

          echo "=== 第七步：生成固件 ==="
          make target/install -j$(nproc) V=s 2>&1 | tee -a build.log || \
            make target/install -j1 V=s 2>&1 | tee -a build.log

        timeout-minutes: 360

      - name: 验证固件内关键软件包
        run: |
          PACKAGE_DB=$(find openwrt/build_dir -type f \( \
            -path '*/root-*/lib/apk/db/installed' -o \
            -path '*/root-*/usr/lib/opkg/status' \) -print -quit)
          if [ -z "$PACKAGE_DB" ]; then
            echo "错误：未找到固件根文件系统的软件包数据库"
            exit 1
          fi
          REQUIRED_PACKAGES=(
            luci-i18n-base-zh-cn luci-i18n-ddns-zh-cn
            luci-i18n-firewall-zh-cn luci-i18n-package-manager-zh-cn
            luci-i18n-ttyd-zh-cn luci-i18n-upnp-zh-cn luci-i18n-wol-zh-cn
            luci-theme-aurora luci-app-aurora-config
            luci-app-clashoo luci-i18n-clashoo-zh-cn luci-app-oxidns
            luci-app-bandix luci-app-quickfile
            kmod-fwx fwxd luci-app-fwx-appfilter luci-app-fwx-dashboard
            luci-app-fwx-session-stat luci-app-fwx-feature iperf3
          )
          MISSING_PACKAGES=()
          for PACKAGE in "${REQUIRED_PACKAGES[@]}"; do
            if ! grep -qxF "P:${PACKAGE}" "$PACKAGE_DB" && \
               ! grep -qxF "Package: ${PACKAGE}" "$PACKAGE_DB"; then
              MISSING_PACKAGES+=("$PACKAGE")
            fi
          done
          if (( ${#MISSING_PACKAGES[@]} > 0 )); then
            echo "错误：固件中缺少以下关键软件包："
            printf '  - %s\n' "${MISSING_PACKAGES[@]}"
            exit 1
          fi
          echo "固件关键软件包验证通过：${#REQUIRED_PACKAGES[@]} 项"

      - name: 调试 - 列出构建输出
        if: always()
        run: |
          echo "=== bin/targets 目录结构 ==="
          find openwrt/bin/targets -type f 2>/dev/null | head -50 || echo "(空)"
          echo ""
          echo "=== build.log 最后 30 行 ==="
          tail -30 openwrt/build.log 2>/dev/null || echo "(无 build.log)"

      - name: 上传固件
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: 10Wrt-r5c-${{ github.run_id }}
          path: |
            openwrt/bin/targets/**/*.img.gz
            openwrt/bin/targets/**/*.img
            openwrt/bin/targets/**/*.bin
            openwrt/bin/targets/**/*.tar.gz
            openwrt/bin/targets/**/openwrt-*-*
          if-no-files-found: warn
          retention-days: 7

      - name: 生成固件清单
        if: always()
        run: |
          echo "## 10Wrt NanoPi R5C 编译结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d openwrt/bin/targets ]; then
            echo "### 固件文件" >> $GITHUB_STEP_SUMMARY
            find openwrt/bin/targets -type f \( \
              -name "*.img.gz" -o -name "*.img" -o -name "*.bin" -o -name "*.tar.gz" \) | \
              sort | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 管理地址: http://10.0.0.1" >> $GITHUB_STEP_SUMMARY

      - name: 发布到 Release
        run: |
          shopt -s nullglob
          TAG="r5c-$(TZ=Asia/Shanghai date +%Y.%m.%d)-${{ github.run_number }}"
          TITLE="10Wrt NanoPi R5C — $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          FIRMWARE_DIR=$(find openwrt/bin/targets -mindepth 1 -type d -name "armv8" 2>/dev/null | head -1)
          if [ -z "$FIRMWARE_DIR" ]; then
            echo "警告：未找到固件目录，跳过发布"
            exit 0
          fi
          echo "固件目录: $FIRMWARE_DIR"
          ls -lh "$FIRMWARE_DIR"/
          gh release create "$TAG" $FIRMWARE_DIR/*.img.gz $FIRMWARE_DIR/*.img $FIRMWARE_DIR/*.tar.gz \
            --title "$TITLE" \
            --notes "### 管理地址: http://10.0.0.1" \
            --latest \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 清理旧 Release/Tag（每设备系列仅保留最新 7 个）
        run: |
          # 每次构建成功后自动清理：r5c / x86_64 各保留最新 7 个 Release，
          # 更旧的 Release 与其 git tag 一并删除（--cleanup-tag）。
          # 若构建失败则本步骤不执行，不会误删。
          for PREFIX in r5c x86_64; do
            echo "=== 清理前缀 ${PREFIX}（保留最新 7 个）==="
            gh api "repos/${{ github.repository }}/releases?per_page=100" \
              --jq 'sort_by(.created_at) | reverse | .[].tag_name' 2>/dev/null \
              | grep -E "^${PREFIX}-" | tail -n +8 | while read -r TAG; do
                echo "删除旧 Release/Tag: ${TAG}"
                gh release delete "$TAG" --yes --cleanup-tag \
                  --repo ${{ github.repository }} || \
                  echo "警告：删除 ${TAG} 失败，已跳过"
              done
          done
          echo "清理完成"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 清理旧 dl 缓存（每个 key 仅保留最新 1 个版本）
        run: |
          # Actions 免费额度仅 0.5GB 存储（缓存+构件），dl 缓存每次构建都会给同一 key 新增一个版本，
          # 不清理会持续累积。这里只保留每个 key 最新 1 个版本，其余删除。
          for KEY in dl-openwrt-x86 dl-openwrt-r5c; do
            echo "=== 清理缓存前缀 ${KEY} ==="
            gh api "repos/${{ github.repository }}/actions/caches?per_page=100" \
              --jq '.actions_caches[] | select(.key | startswith("'"$KEY"'")) | [.id, .created_at] | @tsv' 2>/dev/null \
              | sort -k2,2r | tail -n +2 | cut -f1 | while read -r CID; do
                echo "删除缓存: ${CID}"
                gh api --method DELETE "repos/${{ github.repository }}/actions/caches/${CID}" || \
                  echo "警告：删除缓存 ${CID} 失败，已跳过"
              done
          done
          echo "dl 缓存清理完成"
        env:
          GH_TOKEN: ${{ github.token }}
