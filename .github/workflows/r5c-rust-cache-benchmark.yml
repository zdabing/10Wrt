name: R5C Rust cache cold-warm benchmark

on:
  workflow_dispatch:
  push:
    branches: [codex/build-timing-evidence]
    paths:
      - '.github/workflows/r5c-rust-cache-benchmark.yml'
      - 'scripts/benchmark-rust-cache.sh'

permissions:
  contents: read

concurrency:
  group: rust-cache-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - name: Prepare build host
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang llvm lld flex bison g++ gawk gcc-multilib \
            gettext git libelf-dev libncurses-dev libssl-dev python3 \
            python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev \
            file zstd curl ca-certificates bc
      - name: Cold source build and natural compiler clean
        id: cold
        run: bash scripts/benchmark-rust-cache.sh cold
      - name: Save source-built distribution snapshot
        uses: actions/cache/save@v5
        with:
          path: rust-dist-cache
          key: rust-benchmark-v1-${{ steps.cold.outputs.key }}
      - name: Separate local snapshot before remote restore
        run: mv rust-dist-cache rust-dist-cache-original
      - name: Restore snapshot from GitHub cache
        id: restore
        uses: actions/cache/restore@v5
        with:
          path: rust-dist-cache
          key: rust-benchmark-v1-${{ steps.cold.outputs.key }}
          fail-on-cache-miss: true
      - name: Verify real cache hit and recompile daemon
        run: |
          test '${{ steps.restore.outputs.cache-hit }}' = true
          bash scripts/benchmark-rust-cache.sh warm
      - name: Retain packages, source revisions and timing evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r5c-rust-cache-benchmark-${{ github.run_id }}
          path: zen-cache-benchmark/acceptance-out/
          if-no-files-found: warn
          retention-days: 7
