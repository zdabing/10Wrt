# 10Wrt 网络性能与稳定性调优（位于 sysctl.d，用户可在 /etc/sysctl.conf 覆盖）
# 启用 TCP BBR 拥塞控制（依赖 kmod-tcp-bbr；保持默认 fq_codel 兼顾路由转发防 Bufferbloat 与 BBR 内置 pacing）
net.ipv4.tcp_congestion_control = bbr

# 扩大 socket 缓冲，消除高并发 UDP/QUIC 下的 Udp: RcvbufErrors 丢包
net.core.rmem_max = 7500000
net.core.wmem_max = 7500000

# 提升网卡软中断接收队列上限，缓解突发流量下的 softnet 丢包
net.core.netdev_max_backlog = 4096

# 配合 network.globals.steering_flows 启用 RFS 全局流表
net.core.rps_sock_flow_entries = 32768

# 禁止空闲后 TCP 慢启动重置，改善长连接与代理复用响应
net.ipv4.tcp_slow_start_after_idle = 0

# 启用 TCP MTU 探测，防止 PPPoE (1492) 及跨境链路遇到 PMTUD 黑洞
net.ipv4.tcp_mtu_probing = 1
